<html lang="en">
<head>

<style>

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Setup
 * ------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const RAW_NAME = ((params.get('name') || '').trim() || 'Jasiu').slice(0, 18);
const NAME = RAW_NAME.toUpperCase();
const WISH = `Wszystkiego Najlepszego, ${RAW_NAME}!`;
document.getElementById('title').textContent = WISH;

const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);
const XAXIS = new THREE.Vector3(1, 0, 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrap01 = t => t - Math.floor(t);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
let seed = 2424;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
const _m4 = new THREE.Matrix4(), _c = new THREE.Color(), _e = new THREE.Euler(), _one = V(1, 1, 1), _zero = V(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#d8eef9');
scene.fog = new THREE.Fog(HORIZON, 140, 470);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minDistance = 6;
controls.maxDistance = 320;

const matCache = new Map();
function M(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, ...o }));
  return matCache.get(key);
}
function mesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), mat, parent);
  m.position.set(x, y, z);
  return m;
}
function cyl(rt, rb, h, seg, mat, x = 0, y = 0, z = 0, parent) {
  const m = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, parent);
  m.position.set(x, y, z);
  return m;
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fitFont(g, text, weight, size, maxW, family) {
  g.font = `${weight} ${size}px ${family}`;
  const w = g.measureText(text).width;
  if (w > maxW) { size = Math.floor(size * maxW / w); g.font = `${weight} ${size}px ${family}`; }
  return size;
}
const FONT = 'Arial, Helvetica, "Liberation Sans", sans-serif';

/* ------------------------------------------------------------------ *
 *  Sky, light, environment map
 * ------------------------------------------------------------------ */
function skyGeometry(R, groundColor) {
  const geo = new THREE.SphereGeometry(R, 32, 20);
  const pos = geo.attributes.position, cols = [];
  const zen = new THREE.Color('#4f9fe0'), hor = HORIZON.clone(), gnd = new THREE.Color(groundColor);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / R;
    if (y < 0) c.copy(gnd); else c.copy(hor).lerp(zen, Math.pow(y, 0.55));
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return geo;
}
scene.add(new THREE.Mesh(skyGeometry(1000, HORIZON), new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(skyGeometry(50, '#6f8f58'), new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
const envMap = pmrem.fromScene(envScene, 0.03).texture;

scene.add(new THREE.HemisphereLight(0xe3f2ff, 0x5b7a3a, 1.15));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.target.position.set(25, 0, 10);
sun.position.set(25 + 70, 95, 10 + 35);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 10, far: 320 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

/* ------------------------------------------------------------------ *
 *  Layout of the world
 * ------------------------------------------------------------------ */
const WATER_Y = -0.4;
const CAKE = V(-16, 0, 12);
const MONUMENT = V(2, 0, -14);
const LETTERS = V(66, 0, -80);
const SEA_TOWERS = V(70, 0, 64);
const MODERNISTS = [[66, -108, 20, 10, 4, 0.3], [44, 104, 22, 10, 5, -0.2], [8, 112, 18, 9, 4, 0.1], [-30, -106, 20, 10, 4, -0.1], [70, 104, 15, 9, 3, 1.2]];
const FLAT = [[CAKE.x, CAKE.z, 13], [MONUMENT.x, MONUMENT.z, 11], [LETTERS.x, LETTERS.z, 13], [SEA_TOWERS.x, SEA_TOWERS.z, 15],
              ...MODERNISTS.map(m => [m[0], m[1], 13])];

/* ------------------------------------------------------------------ *
 *  The road loop
 * ------------------------------------------------------------------ */
const RAW = [[0, -50], [28, -49], [50, -36], [58, -10], [50, 14], [56, 38], [38, 56], [12, 52],
             [-14, 60], [-40, 50], [-56, 26], [-48, 2], [-58, -24], [-34, -46]];
const center = new THREE.CatmullRomCurve3(RAW.map(([x, z]) => V(x, 0, z)), true, 'centripetal');
center.arcLengthDivisions = 3000;
const Lc = center.getLength();
const N = 900;
const cSamples = [];
for (let i = 0; i < N; i++) {
  const u = i / N, p = center.getPointAt(u), t = center.getTangentAt(u);
  cSamples.push({ p, t, r: V(-t.z, 0, t.x) });
}
function offsetCurve(off, y = 0) {
  const pts = cSamples.map(({ p, r }) => V(p.x + r.x * off, y, p.z + r.z * off));
  const c = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  c.arcLengthDivisions = 4000;
  return c;
}
const flatXZ = [];
for (let i = 0; i < N; i += 2) flatXZ.push(cSamples[i].p.x, cSamples[i].p.z);
function distRoad(x, z) {
  let m = 1e9;
  for (let i = 0; i < flatXZ.length; i += 2) {
    const dx = flatXZ[i] - x, dz = flatXZ[i + 1] - z, d = dx * dx + dz * dz;
    if (d < m) m = d;
  }
  return Math.sqrt(m);
}
function groundH(x, z) {
  let amp = smooth(16, 45, distRoad(x, z)) * (1 - smooth(60, 74, x));
  for (const [fx, fz, r] of FLAT) { const q = Math.hypot(x - fx, z - fz); if (q < r + 10) amp *= smooth(r, r + 10, q); }
  let h = 0;
  if (amp > 0) h = amp * (Math.sin(x * 0.045) * Math.cos(z * 0.05) * 1.6 + Math.sin(x * 0.11 + z * 0.09) * 0.6 +
                         Math.sin(x * 0.021 - z * 0.025) * 2.2 + 1.2);
  const s = smooth(86, 104, x);                      // Baltic coast to the east
  return h * (1 - s) - 1.8 * s;
}

// ground (grass inland, sand on the beach)
{
  const geo = new THREE.PlaneGeometry(1000, 1000, 166, 166);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)) - 0.01);
  const g2 = geo.toNonIndexed();
  const pos = g2.attributes.position, col = new Float32Array(pos.count * 3);
  const greens = ['#7fb24a', '#76aa44', '#88b955', '#6fa140', '#82b44e'].map(c => new THREE.Color(c));
  const sands = ['#ecdcab', '#e5d29c', '#f0e2b8'].map(c => new THREE.Color(c));
  const wet = ['#bfa874', '#b39c69'].map(c => new THREE.Color(c));
  for (let f = 0; f < pos.count; f += 3) {
    const cx = (pos.getX(f) + pos.getX(f + 1) + pos.getX(f + 2)) / 3, cy = (pos.getY(f) + pos.getY(f + 1) + pos.getY(f + 2)) / 3;
    const c = cx > 81.5 ? pick(cy < -0.6 ? wet : sands) : pick(greens);
    for (let k = 0; k < 3; k++) col.set([c.r, c.g, c.b], (f + k) * 3);
  }
  g2.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g2.computeVertexNormals();
  const ground = new THREE.Mesh(g2, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  ground.receiveShadow = true;
  scene.add(ground);
}

function stripMesh(pos, mat) {
  const idx = [];
  for (let i = 0; i < N; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; scene.add(m);
}
function ribbon(o0, o1, y, mat) {
  const pos = new Float32Array((N + 1) * 6);
  for (let i = 0; i <= N; i++) {
    const { p, r } = cSamples[i % N];
    pos.set([p.x + r.x * o0, y, p.z + r.z * o0, p.x + r.x * o1, y, p.z + r.z * o1], i * 6);
  }
  stripMesh(pos, mat);
}
function wall(o, y0, y1, mat) {
  const pos = new Float32Array((N + 1) * 6);
  for (let i = 0; i <= N; i++) {
    const { p, r } = cSamples[i % N], x = p.x + r.x * o, z = p.z + r.z * o;
    pos.set([x, y0, z, x, y1, z], i * 6);
  }
  stripMesh(pos, mat);
}
{
  const asphalt = M('#4b4e53', { roughness: 0.95 });
  const paint = M('#f4f4ef', { roughness: 0.7 });
  const curb = M('#bdbcb5', { side: THREE.DoubleSide });
  const walk = M('#aaa79f', { roughness: 0.95 });
  ribbon(-3.65, 3.65, 0.03, asphalt);
  ribbon(-3.45, -3.3, 0.04, paint);
  ribbon(3.3, 3.45, 0.04, paint);
  for (const s of [-1, 1]) {
    const a = s * 3.65, b = s * 3.85, c = s * 6.4;
    ribbon(Math.min(a, b), Math.max(a, b), 0.15, curb);
    ribbon(Math.min(b, c), Math.max(b, c), 0.14, walk);
    wall(a, 0.02, 0.15, curb);
    wall(c, -0.05, 0.14, curb);
  }
  const n = Math.floor(Lc / 6);
  const dash = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.14, 3).rotateX(-Math.PI / 2), paint, n);
  for (let i = 0; i < n; i++) {
    const u = i / n, p = center.getPointAt(u), t = center.getTangentAt(u);
    _q.setFromAxisAngle(UP, Math.atan2(t.x, t.z));
    dash.setMatrixAt(i, _m4.compose(V(p.x, 0.04, p.z), _q, _one));
  }
  dash.receiveShadow = true;
  scene.add(dash);
}

// helpers to place things along the road: group local +z = travel direction, local -x = right side
function frameGroup(u) {
  const g = new THREE.Group(), p = center.getPointAt(wrap01(u)), t = center.getTangentAt(wrap01(u));
  g.position.copy(p);
  g.rotation.y = Math.atan2(t.x, t.z);
  scene.add(g);
  g.updateMatrixWorld(true);
  return g;
}
function roadSpot(u, off, along = 0) {
  const uu = wrap01(u + along / Lc), p = center.getPointAt(uu), t = center.getTangentAt(uu);
  const r = V(-t.z, 0, t.x);
  const pos = p.clone().addScaledVector(r, off);
  const dir = r.clone().multiplyScalar(-Math.sign(off) || 1);
  return { pos, yaw: Math.atan2(dir.x, dir.z), t, r };
}
function nearestU(curve, target, M = 3000) {
  let best = 0, bd = 1e18; const v = new THREE.Vector3();
  for (let k = 0; k < M; k++) { curve.getPointAt(k / M, v); const d = v.distanceToSquared(target); if (d < bd) { bd = d; best = k; } }
  return best / M;
}
const loopDist = (u1, u2) => { const d = Math.abs(wrap01(u1) - wrap01(u2)); return Math.min(d, 1 - d) * Lc; };

const U_STOP = nearestU(center, V(14, 0, -50));
const U_BANNER = wrap01(U_STOP + 0.5);
const U_ZEBRA = wrap01(U_STOP + 17 / Lc);
const U_ARCH = wrap01(U_STOP - 46 / Lc);
const stopTan = center.getTangentAt(U_STOP), stopRight = V(-stopTan.z, 0, stopTan.x);
const stopWorld = center.getPointAt(U_STOP);

/* ------------------------------------------------------------------ *
 *  Overhead trolleybus wires, masts and street lamps
 * ------------------------------------------------------------------ */
const WIRE_H = 5.7;
const laneR = offsetCurve(1.75), laneL = offsetCurve(-1.75);
const LR = laneR.getLength(), LL = laneL.getLength();
const wireOffsets = [1.45, 2.05, -1.45, -2.05];
const wires = wireOffsets.map(o => offsetCurve(o, WIRE_H));
{
  const wm = M('#2a2c30', { roughness: 0.5, metalness: 0.4 });
  for (const w of wires) {
    const m = new THREE.Mesh(new THREE.TubeGeometry(w, 1800, 0.022, 4, true), wm);
    m.castShadow = true; scene.add(m);
  }
}
const lampUs = [];
{
  const mastM = M('#6c7075', { roughness: 0.6, metalness: 0.3 });
  const insM = M('#7a4b2a');
  for (let sc = 5; sc < Lc - 10; sc += 27) {
    const u = sc / Lc;
    if (loopDist(u, U_STOP) < 13 || loopDist(u, U_BANNER) < 6 || loopDist(u, U_ZEBRA) < 4 || loopDist(u, U_ARCH) < 5) continue;
    const g = frameGroup(u);
    cyl(0.1, 0.15, 7.4, 7, mastM, -5.9, 3.7, 0, g);
    cyl(0.16, 0.16, 0.1, 7, mastM, -5.9, 7.45, 0, g);
    const arm = cyl(0.05, 0.05, 8.7, 5, mastM, -1.65, 6.25, 0, g); arm.rotation.z = Math.PI / 2;
    const stay = cyl(0.03, 0.03, 4.4, 4, mastM, -3.8, 6.85, 0, g); stay.rotation.z = Math.PI / 2 - 0.28;
    for (const o of wireOffsets) {
      cyl(0.015, 0.015, 0.5, 4, mastM, -o, 5.98, 0, g);
      cyl(0.05, 0.05, 0.14, 6, insM, -o, 6.12, 0, g);
    }
  }
  const lampM = M('#50555b', { roughness: 0.5, metalness: 0.4 });
  const headM = M('#fdf6dc', { emissive: '#fff1c2', emissiveIntensity: 0.4 });
  for (let sc = 18; sc < Lc - 8; sc += 33) {
    const u = sc / Lc;
    if (loopDist(u, U_BANNER) < 5 || loopDist(u, U_ZEBRA) < 4 || loopDist(u, U_ARCH) < 6) continue;
    const g = frameGroup(u);
    cyl(0.07, 0.1, 6.4, 6, lampM, 5.5, 3.2, 0, g);
    const arm = cyl(0.04, 0.04, 1.5, 5, lampM, 4.8, 6.35, 0, g); arm.rotation.z = Math.PI / 2;
    box(0.55, 0.1, 0.26, headM, 4.1, 6.3, 0, g);
    lampUs.push(u);
  }
}

/* ------------------------------------------------------------------ *
 *  LED dot-matrix helper
 * ------------------------------------------------------------------ */
function ledRender(src, cols, rows, dst, dx, dy, dot, on = '#ffc23a', off = '#2b1a07') {
  const d = src.getImageData(0, 0, cols, rows).data;
  dst.fillStyle = '#060504'; dst.fillRect(dx, dy, cols * dot, rows * dot);
  const pOn = new Path2D(), pOff = new Path2D(), r = dot * 0.37;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const cx = dx + x * dot + dot / 2, cy = dy + y * dot + dot / 2;
    const p = d[(y * cols + x) * 4] > 105 ? pOn : pOff;
    p.moveTo(cx + r, cy); p.arc(cx, cy, r, 0, TAU);
  }
  dst.fillStyle = off; dst.fill(pOff);
  dst.save(); dst.fillStyle = on; dst.shadowColor = on; dst.shadowBlur = dot * 0.9; dst.fill(pOn); dst.restore();
}

/* ------------------------------------------------------------------ *
 *  Trolleybus textures (Gdynia PKT livery)
 * ------------------------------------------------------------------ */
const BUS_L = 12, BUS_W = 2.55, Y0 = 0.32, Y1 = 3.05, BH = Y1 - Y0;
const AX_F = 3.3, AX_R = -2.6, WB = AX_F - AX_R;
const DOORS = [{ z: 4.85, w: 1.25 }, { z: 0.6, w: 1.25 }, { z: -4.15, w: 1.25 }];
const BLUE = '#1f57b5', BLUE_D = '#173f86', LBLUE = '#3b8de0', WHITE = '#f4f6f4', GLASS = '#0c0f13';
const BALLOON_COLS = ['#ff4d6d', '#ffd23f', '#3b8de0', '#7be06e', '#ff9f43', '#c084fc', '#ffffff'];

function leaf(g, x, y, ang, len, col) {
  g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col;
  g.beginPath(); g.moveTo(0, 0);
  g.quadraticCurveTo(len * 0.5, -len * 0.38, len, 0);
  g.quadraticCurveTo(len * 0.5, len * 0.38, 0, 0);
  g.fill(); g.restore();
}
function bigLeaf(g, x, y, s) {
  g.save(); g.translate(x, y); g.rotate(-0.7);
  g.fillStyle = '#3aa935';
  g.beginPath(); g.moveTo(-s * 0.5, 0);
  g.quadraticCurveTo(0, -s * 0.6, s * 0.6, 0); g.quadraticCurveTo(0, s * 0.6, -s * 0.5, 0); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = s * 0.06;
  g.beginPath(); g.moveTo(-s * 0.42, 0); g.lineTo(s * 0.5, 0); g.stroke();
  g.strokeStyle = '#3aa935'; g.lineWidth = s * 0.09; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-s * 0.5, 0); g.quadraticCurveTo(-s * 0.85, s * 0.1, -s * 0.78, s * 0.5); g.stroke();
  g.restore();
}
function plate(g, cx, cy, w, h) {
  g.fillStyle = '#fff'; g.fillRect(cx - w / 2, cy - h / 2, w, h);
  g.strokeStyle = '#111'; g.lineWidth = Math.max(1, h * 0.06); g.strokeRect(cx - w / 2, cy - h / 2, w, h);
  g.fillStyle = '#1f4fbf'; g.fillRect(cx - w / 2, cy - h / 2, w * 0.11, h);
  g.fillStyle = '#111'; g.font = `bold ${h * 0.72}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('GA 3894Y', cx + w * 0.05, cy + h * 0.04);
}
function gdyniaLogo(g, x, y, s) {
  g.save();
  g.strokeStyle = '#fff'; g.lineWidth = s * 0.13;
  g.beginPath(); g.arc(x + s * 0.4, y, s * 0.36, 0, TAU); g.stroke();
  g.strokeStyle = LBLUE; g.lineWidth = s * 0.1;
  g.beginPath(); g.moveTo(x + s * 0.15, y + s * 0.06); g.quadraticCurveTo(x + s * 0.4, y - s * 0.2, x + s * 0.65, y + s * 0.06); g.stroke();
  g.fillStyle = '#fff'; g.font = `italic 700 ${s}px ${FONT}`; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillText('Gdynia', x + s * 0.95, y + s * 0.05);
  g.restore();
}

function sideTex(right) {
  const W = 2048, ppm = W / BUS_L, H = Math.round(BH * ppm);
  const [c, g] = makeCanvas(W, H);
  const X = z => right ? (z + BUS_L / 2) * ppm : (BUS_L / 2 - z) * ppm;
  const Yp = y => (Y1 - y) * ppm;
  const band = (y0, y1, col) => { g.fillStyle = col; g.fillRect(0, Yp(y1), W, Yp(y0) - Yp(y1)); };
  band(Y0, Y1, WHITE);
  band(Y0, 0.98, BLUE);
  band(Y0, 0.42, BLUE_D);
  band(1.28, 2.6, GLASS);
  const gr = g.createLinearGradient(0, Yp(2.6), 0, Yp(1.28));
  gr.addColorStop(0, 'rgba(150,185,220,0.30)'); gr.addColorStop(0.5, 'rgba(60,80,100,0.10)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, Yp(2.6), W, Yp(1.28) - Yp(2.6));
  g.fillStyle = '#1d242d';
  for (let z = -5.7; z < 5.9; z += 1.42) g.fillRect(X(z) - 3, Yp(2.6), 6, Yp(1.28) - Yp(2.6));
  g.fillStyle = 'rgba(255,255,255,0.06)';
  for (let k = 0; k < 7; k++) {
    const x = (k + 0.3) * W / 7;
    g.beginPath(); g.moveTo(x, Yp(2.6)); g.lineTo(x + 70, Yp(2.6)); g.lineTo(x - 30, Yp(1.28)); g.lineTo(x - 100, Yp(1.28)); g.fill();
  }
  band(2.78, 2.92, LBLUE);
  g.fillStyle = '#16181b';
  for (const az of [AX_F, AX_R]) {
    const cx = X(az), cy = Yp(0.5), r = 0.64 * ppm;
    g.beginPath(); g.arc(cx, cy, r, Math.PI, TAU); g.lineTo(cx + r, H); g.lineTo(cx - r, H); g.closePath(); g.fill();
  }
  const vy = z => 1.13 + 0.065 * Math.sin(z * 2.4);
  g.lineCap = 'round';
  g.strokeStyle = LBLUE; g.lineWidth = 0.012 * ppm; g.beginPath();
  for (let z = -5.9; z <= 5.9; z += 0.05) { const y = 1.13 + 0.06 * Math.sin(z * 2.4 + 1.7); z === -5.9 ? g.moveTo(X(z), Yp(y)) : g.lineTo(X(z), Yp(y)); }
  g.stroke();
  g.strokeStyle = '#4cb04a'; g.lineWidth = 0.03 * ppm; g.beginPath();
  for (let z = -5.9; z <= 5.9; z += 0.05) { z === -5.9 ? g.moveTo(X(z), Yp(vy(z))) : g.lineTo(X(z), Yp(vy(z))); }
  g.stroke();
  const leafCols = ['#2ea44f', '#86c440', '#138a3c'], dir = right ? 1 : -1;
  for (let z = -5.7, k = 0; z < 5.7; z += 0.36, k++) {
    const up = k % 2 === 0;
    const ang = dir > 0 ? (up ? -0.9 : 0.7) : (up ? -(Math.PI - 0.9) : Math.PI - 0.7);
    leaf(g, X(z), Yp(vy(z)), ang, (0.11 + (k % 3) * 0.025) * ppm, leafCols[k % 3]);
  }
  if (!right) bigLeaf(g, X(4.7), Yp(1.12), 0.3 * ppm);
  if (right) for (const d of DOORS) {
    const xa = X(d.z - d.w / 2), xb = X(d.z + d.w / 2), yt = Yp(2.58), yb = H;
    g.fillStyle = '#3a4049'; g.fillRect(xa, yt, xb - xa, yb - yt);
    g.fillStyle = '#5c6570'; g.fillRect(xa + 10, yt + 10, xb - xa - 20, (yb - yt) * 0.55);
    g.fillStyle = '#7c8188'; g.fillRect(xa, Yp(0.46), xb - xa, yb - Yp(0.46));
    g.fillStyle = '#f5c400';
    for (const f of [0.28, 0.72]) g.fillRect(xa + (xb - xa) * f - 4, yt, 8, Yp(0.46) - yt);
    g.strokeStyle = '#cfd4da'; g.lineWidth = 5; g.strokeRect(xa, yt, xb - xa, yb - yt);
  }
  gdyniaLogo(g, right ? X(-2.75) : X(3.65), Yp(1.98), 0.22 * ppm);
  return canvasTex(c);
}

function frontTex() {
  const W = 512, ppm = W / BUS_W, H = Math.round(BH * ppm);

  const X = x => (x + BUS_W / 2) * ppm, Yp = y => (Y1 - y) * ppm;

  g.fillStyle = BLUE_D; g.fillRect(0, Yp(0.42), W, H - Yp(0.42));
  g.fillStyle = GLASS; rrect(g, X(-1.25), Yp(2.94), 2.5 * ppm, (2.94 - 1.3) * ppm, 0.1 * ppm); g.fill();
  const gr = g.createLinearGradient(X(-1.2), Yp(2.5), X(1.2), Yp(1.3));
  gr.addColorStop(0, 'rgba(170,200,230,0.32)'); gr.addColorStop(0.45, 'rgba(90,110,130,0.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(X(-1.2), Yp(2.56), 2.4 * ppm, (2.56 - 1.34) * ppm);
  g.fillStyle = '#20262e'; g.fillRect(X(-1.25), Yp(2.58), 2.5 * ppm, 3);
  g.fillStyle = '#1b2027'; g.fillRect(X(-0.03), Yp(2.56), 0.06 * ppm, (2.56 - 1.32) * ppm);
  g.fillStyle = '#2b2f35';
  for (const s of [-1, 1]) { rrect(g, X(s * 0.93 - 0.27), Yp(1.07), 0.54 * ppm, 0.25 * ppm, 0.06 * ppm); g.fill(); }
  g.fillStyle = '#2a6fd6';
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(X(-0.78 + i * 0.11), Yp(1.18), 0.04 * ppm, 0, TAU); g.fill(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `bold ${0.075 * ppm}px ${FONT}`; g.fillStyle = '#8a8f96'; g.fillText('SOLARIS', X(0), Yp(0.85));

  g.strokeText('3082', X(0.3), Yp(1.15)); g.fillText('3082', X(0.3), Yp(1.15));
  bigLeaf(g, X(0.66), Yp(1.13), 0.17 * ppm);
  plate(g, X(0), Yp(0.52), 0.52 * ppm, 0.115 * ppm);
  return canvasTex(c);
}

function cakeIcon(g, cx, cy, r) {
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  g.strokeStyle = '#2ea44f'; g.lineWidth = r * 0.17; g.beginPath(); g.arc(cx, cy, r * 0.92, 0, TAU); g.stroke();
  const w = r * 1.05, h = r * 0.5, top = cy - h * 0.15;
  g.fillStyle = '#f7a8c4'; g.fillRect(cx - w / 2, top, w, h);
  g.fillStyle = '#fff4e6'; g.fillRect(cx - w / 2, top, w, h * 0.28);
  g.fillStyle = '#e2507f'; for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(cx - w / 2 + w * (i + 0.5) / 5, top + h * 0.62, r * 0.05, 0, TAU); g.fill(); }
  g.fillStyle = '#8c5a2e'; g.fillRect(cx - w * 0.6, top + h, w * 1.2, r * 0.06);
  for (const i of [-1, 1]) {
    const x = cx + i * w * 0.2;
    g.fillStyle = LBLUE; g.fillRect(x - r * 0.045, top - r * 0.3, r * 0.09, r * 0.3);
    g.fillStyle = '#ffb21f'; g.beginPath(); g.ellipse(x, top - r * 0.38, r * 0.05, r * 0.09, 0, 0, TAU); g.fill();
  }
}

function rearTex() {

  g.fillText('HAPPY', X(0.47), Yp(1.5)); g.fillText('BIRTHDAY!', X(0.47), Yp(1.33));

  g.fillStyle = '#9ea4aa';
  for (let i = 0; i < 9; i++) g.fillRect(X(-0.62) + 6 + i * 0.054 * ppm, Yp(1.72), 0.025 * ppm, 0.76 * ppm);
  g.fillStyle = '#2b2f35';
  for (const s of [-1, 1]) { rrect(g, X(s * 1.12 + 0.11), Yp(1.52), 0.22 * ppm, 0.72 * ppm, 0.05 * ppm); g.fill(); }
  plate(g, X(0), Yp(0.55), 0.52 * ppm, 0.115 * ppm);

function doorLeafTex() {
  const [c, g] = makeCanvas(128, 256);
  g.fillStyle = '#12161b'; g.fillRect(0, 0, 128, 256);

  gr.addColorStop(0, 'rgba(160,190,220,0.25)'); gr.addColorStop(0.6, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 256);
  g.strokeStyle = '#c7ccd2'; g.lineWidth = 8; g.strokeRect(4, 4, 120, 248);

/* ------------------------------------------------------------------ *
 *  Destination display (animated LED)
 * ------------------------------------------------------------------ */
const DCOLS = 160, DROWS = 20, DOT = 6, DREG_X = 27, DREG_W = DCOLS - DREG_X;
const dSmall = document.createElement('canvas'); dSmall.width = DCOLS; dSmall.height = DROWS;
const dsx = dSmall.getContext('2d', { willReadFrequently: true });
const [dBig, dbx] = makeCanvas(DCOLS * DOT, DROWS * DOT);
const destTex = canvasTex(dBig);
const MESSAGES = ['DĄBROWA MIĘTOWA', 'HAPPY BIRTHDAY!', `STO LAT, ${NAME}!`, WISH];
const DEST_FONT = `bold 13px ${FONT}`;
dsx.font = DEST_FONT;
const msgW = MESSAGES.map(m => Math.ceil(dsx.measureText(m).width));
const fits = i => msgW[i] <= DREG_W * 1.22;
const msgDur = i => fits(i) ? (i === 0 ? 7 : 4.5) : (DREG_W + msgW[i]) / 36 + 0.4;
let msgIdx = 0, msgStart = 0, lastDisp = -1;
function drawDestination(t) {
  if (t - lastDisp < 1 / 15 && lastDisp >= 0) return;
  lastDisp = t;
  if (t - msgStart > msgDur(msgIdx)) { msgIdx = (msgIdx + 1) % MESSAGES.length; msgStart = t; }
  const el = t - msgStart;
  dsx.fillStyle = '#000'; dsx.fillRect(0, 0, DCOLS, DROWS);
  dsx.fillStyle = '#fff'; dsx.textBaseline = 'alphabetic';
  dsx.font = `bold 20px ${FONT}`; dsx.fillText('24', 1, 18);
  dsx.save(); dsx.beginPath(); dsx.rect(DREG_X, 0, DREG_W, DROWS); dsx.clip();
  dsx.font = DEST_FONT;
  const w = msgW[msgIdx];
  if (fits(msgIdx)) {            // squeeze slightly-too-wide text, like a condensed LED font
    const k = Math.min(1, (DREG_W - 2) / w);
    dsx.translate(DREG_X + (DREG_W - w * k) / 2, 0); dsx.scale(k, 1);
    dsx.fillText(MESSAGES[msgIdx], 0, 15);
  } else dsx.fillText(MESSAGES[msgIdx], Math.round(DREG_X + DREG_W - el * 36), 15);
  dsx.restore();
  ledRender(dsx, DCOLS, DROWS, dbx, 0, 0, DOT);
  destTex.needsUpdate = true;
}

/* ------------------------------------------------------------------ *
 *  Build the trolleybus (Solaris Trollino 12, PKT Gdynia)
 * ------------------------------------------------------------------ */
function buildBus() {
  const root = new THREE.Group();                       // origin = rear axle on the road
  const sway = new THREE.Group(); sway.position.set(0, 0.55, WB / 2); root.add(sway);
  const body = new THREE.Group(); body.position.set(0, -0.55, -AX_R - WB / 2); sway.add(body);

  const paint = map => new THREE.MeshStandardMaterial({ map, roughness: 0.36, metalness: 0.05, envMap, envMapIntensity: 0.9 });
  const white = new THREE.MeshStandardMaterial({ color: WHITE, roughness: 0.42, envMap, envMapIntensity: 0.7 });
  const shellMats = [paint(sideTex(false)), paint(sideTex(true)), white, M('#1b1c1f'), paint(frontTex()), paint(rearTex())];
  box(BUS_W, BH, BUS_L, shellMats, 0, (Y0 + Y1) / 2, 0, body);
  box(BUS_W - 0.3, 0.16, BUS_L - 0.4, M('#1b1c1f'), 0, 0.3, 0, body);

  const pod = new THREE.Shape();
  pod.moveTo(0.8, 0); pod.lineTo(5.85, 0); pod.lineTo(5.5, 0.42); pod.lineTo(1.2, 0.42); pod.lineTo(0.8, 0);
  const podGeo = new THREE.ExtrudeGeometry(pod, { depth: 2.25, bevelEnabled: false });
  podGeo.rotateY(-Math.PI / 2); podGeo.translate(1.125, Y1, 0);
  mesh(podGeo, white, body);
  const lb = new THREE.MeshStandardMaterial({ color: LBLUE, roughness: 0.4, envMap });
  for (const s of [-1, 1]) box(0.02, 0.08, 3.9, lb, s * 1.128, Y1 + 0.24, 3.35, body);
  box(2.1, 0.28, 3.6, white, 0, Y1 + 0.14, -3.0, body);
  box(1.3, 0.12, 0.6, M('#2c2f33'), 0, Y1 + 0.34, -1.6, body);
  for (const s of [-1, 1]) cyl(0.07, 0.07, 0.35, 8, M('#3a3d42', { metalness: 0.5 }), s * 0.32, Y1 + 0.42, -1.6, body).rotation.x = Math.PI / 2;
  for (const s of [-1, 1]) box(0.08, 0.18, 0.08, M('#2c2f33'), s * 0.32, Y1 + 0.09, -5.85, body);

  const head = new THREE.MeshStandardMaterial({ color: '#fffbe8', emissive: '#fff3c4', emissiveIntensity: 1.3 });
  const indL = new THREE.MeshStandardMaterial({ color: '#ff9d1a', emissive: '#ff8a00', emissiveIntensity: 0.1 });
  const indR = new THREE.MeshStandardMaterial({ color: '#ff9d1a', emissive: '#ff8a00', emissiveIntensity: 0.1 });
  const brake = new THREE.MeshStandardMaterial({ color: '#d0121b', emissive: '#ff1020', emissiveIntensity: 0.5 });
  for (const s of [-1, 1]) {
    box(0.3, 0.12, 0.03, head, s * 1.0, 0.95, BUS_L / 2 + 0.01, body);
    box(0.13, 0.12, 0.03, head, s * 0.73, 0.95, BUS_L / 2 + 0.01, body);
    box(0.1, 0.07, 0.03, s > 0 ? indL : indR, s * 1.13, 1.06, BUS_L / 2 + 0.012, body);
    box(0.16, 0.42, 0.03, brake, s * 1.12, 1.2, -BUS_L / 2 - 0.01, body);
    box(0.16, 0.12, 0.03, s > 0 ? indL : indR, s * 1.12, 1.44, -BUS_L / 2 - 0.012, body);
    box(0.03, 0.08, 0.16, s > 0 ? indL : indR, s * (BUS_W / 2 + 0.01), 0.9, 4.1, body);
  }
  for (const s of [-1, 1]) {
    const w = box(0.95, 0.025, 0.02, M('#111'), s * 0.5, 1.42, BUS_L / 2 + 0.02, body);
    w.rotation.z = s * 0.22;
  }
  const mirrorM = M('#15171a', { roughness: 0.5 });
  for (const s of [-1, 1]) {
    const a = box(0.05, 0.05, 0.5, mirrorM, s * 1.33, 2.93, BUS_L / 2 + 0.17, body); a.rotation.y = -s * 0.25;
    box(0.04, 0.5, 0.04, mirrorM, s * 1.42, 2.68, BUS_L / 2 + 0.4, body);
    box(0.08, 0.4, 0.2, mirrorM, s * 1.43, 2.26, BUS_L / 2 + 0.38, body);
  }

  const dispMat = new THREE.MeshBasicMaterial({ map: destTex, toneMapped: false });
  const front = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.3 / 8), dispMat);
  front.position.set(0, 2.74, BUS_L / 2 + 0.012); body.add(front);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.15), dispMat);
  side.position.set(-BUS_W / 2 - 0.006, 2.42, 3.0); side.rotation.y = -Math.PI / 2; body.add(side);

  const leafMat = new THREE.MeshStandardMaterial({ map: doorLeafTex(), roughness: 0.25, metalness: 0.2, envMap });
  const doors = [];
  for (const d of DOORS) {
    const lw = d.w / 2 - 0.01;
    for (const sgn of [-1, 1]) {
      const leafM = new THREE.Mesh(new THREE.PlaneGeometry(lw, 2.16), leafMat);
      leafM.rotation.y = -Math.PI / 2;
      leafM.userData = { x0: -BUS_W / 2 - 0.012, z0: d.z + sgn * lw / 2, sgn, lw };
      leafM.position.set(leafM.userData.x0, 1.45, leafM.userData.z0);
      body.add(leafM); doors.push(leafM);
    }
  }

  const tireM = M('#1d1e20', { roughness: 0.9 }), hubM = M('#c9ccd0', { roughness: 0.4, metalness: 0.6 });
  function wheel(sideSign) {
    const spin = new THREE.Group();
    mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.32, 14), tireM, spin).rotation.z = Math.PI / 2;
    mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.34, 10), hubM, spin).rotation.z = Math.PI / 2;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      box(0.03, 0.06, 0.06, M('#555a60'), sideSign * 0.175, Math.sin(a) * 0.17, Math.cos(a) * 0.17, spin);
    }
    box(0.03, 0.42, 0.06, M('#8d9399'), sideSign * 0.172, 0, 0, spin);
    return spin;
  }
  const spins = [], steers = [];
  for (const [z, isFront] of [[0, false], [WB, true]]) {
    for (const s of [-1, 1]) {
      const holder = new THREE.Group(); holder.position.set(s * 1.07, 0.5, z); root.add(holder);
      const sp = wheel(s); holder.add(sp); spins.push(sp);
      if (isFront) steers.push(holder);
    }
  }

  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  front.castShadow = side.castShadow = false;
  scene.add(root);
  return { root, sway, body, spins, steers, doors, indL, indR, brake };
}
const bus = buildBus();
const busInv = new THREE.Matrix4();

// trolley poles live in world space (they track the wires)
const POLE_LEN = 6.3;
const poles = [0, 1].map(() => {
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(0.03, 0.045, POLE_LEN, 6); geo.rotateX(Math.PI / 2); geo.translate(0, 0, POLE_LEN / 2);
  mesh(geo, M('#1a1b1e', { roughness: 0.5 }), g);
  box(0.09, 0.07, 0.34, M('#3b3f45', { metalness: 0.5 }), 0, 0.02, POLE_LEN - 0.08, g);
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6),
    new THREE.MeshBasicMaterial({ color: '#d8f0ff', transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, toneMapped: false }));
  spark.position.set(0, 0.06, POLE_LEN); spark.visible = false; g.add(spark);
  const rope = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0, 0, 0), V(0, 0, 0), V(0, 0, 0)]),
    new THREE.LineBasicMaterial({ color: '#202124' }));
  rope.frustumCulled = false;
  scene.add(g, rope);
  return { g, spark, rope, sparkT: 0 };
});

/* ------------------------------------------------------------------ *
 *  Balloon physics: Verlet strings with buoyant balloons
 *    - lift, quadratic + linear air drag against a gusty wind
 *    - inextensible (but slack-able) string, balloon-balloon contact
 *    - collision with the bus body, so they bump along the roof

      g.gain.setValueAtTime(vol * sw * (0.35 + Math.random() * 0.65) + 0.0001, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
      src.connect(bp); bp.connect(g); g.connect(p); p.connect(this.amb);
      src.start(t, Math.random() * 2.5, 0.05);
    }
  },
  bell(delay = 0) {
    if (!this.on) return;
    const at = this.ctx.currentTime + delay;
    for (const [f, dt] of [[1318.5, 0], [987.8, 0.32]]) {
      const g = this.env(at + dt, 0.035, 0.005, 1.1, [this.amb, this.rev]);
      this.osc('sine', f, at + dt, at + dt + 1.3, g); this.osc('sine', f * 2.76, at + dt, at + dt + 0.5, g, 0.08);
    }
  },
  tick() {
    if (!this.on) return;
    const now = this.ctx.currentTime, ahead = now + 0.5;
    for (;;) {
      const ev = this.events[this.evI], at = this.songT0 + (this.loopN * this.LOOP + ev.t) * this.BEAT;
      if (at > ahead) break;
      if (at > now - 0.05) this.play(ev, at, this.loopN);
      if (++this.evI >= this.events.length) { this.evI = 0; this.loopN++; }
    }
    if (now > this.nextCar) { this.car(now + 0.05); this.nextCar = now + 3 + Math.random() * 6; }
    if (now > this.nextBird) { this.birds(now + 0.05); this.nextBird = now + 1.5 + Math.random() * 5; }
  },
  update(crowd) {
    if (!this.on) return;
    this.crowd.gain.setTargetAtTime(crowd * 0.035, this.ctx.currentTime, 0.4);
  },
};

/* ------------------------------------------------------------------ *
 *  Simulation
 * ------------------------------------------------------------------ */
const VMAX = 9, ACC = 1.3, DEC = 1.7, DWELL = 7;
const DOOR1_ROOT = DOORS[0].z - AX_R;                     // front door, measured from rear axle
const laneAt = u => roadSpot(u, 1.75).pos;
const S_STOP = wrap01(nearestU(laneR, laneAt(U_STOP)) - DOOR1_ROOT / LR) * LR;
const S_ARCH = nearestU(laneR, laneAt(U_ARCH)) * LR;
const S_BANNER = nearestU(laneR, laneAt(U_BANNER)) * LR;
const wrapLen = d => ((d % LR) + LR) % LR;

// start mid-drive, cruising towards the balloon arch and the stop
const START_S = wrapLen(S_STOP - 95);
const sim = { s: START_S, v: VMAX, mode: 'drive', dwellT: 0, doorO: 0, wheelA: 0, indUntil: -1,
              prevHeading: null, roll: 0, pitch: 0, a: 0, prevFront: null };
let time = 0;

const tA = V(0, 0, 0), tB = V(0, 0, 0), tC = V(0, 0, 0), tTip = V(0, 0, 0), tBase = V(0, 0, 0), tmp = V(0, 0, 0);
const busCenter = V(0, 0, 0), busFwd = V(0, 0, 1);

function poleTip(base, wire, t0, out) {
  let lo = t0 - 20 / Lc, hi = t0 + 1 / Lc;
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    wire.getPoint(wrap01(mid), tmp);
    if (tmp.distanceTo(base) > POLE_LEN) lo = mid; else hi = mid;
  }
  return wire.getPoint(wrap01((lo + hi) / 2), out);
}

function onArrive() {
    Sound.bell(0.8); Sound.applause(0.2, 2.6, 0.12);
}
function onArch() {
  for (const s of [-1, 1]) {
    const p = archGroup.localToWorld(V(s * 6.6, 1.5, 0));
    const inward = archGroup.localToWorld(V(0, 1.5, 0)).sub(p).normalize().multiplyScalar(3);
    burst(p, 220, { spread: 0.6, up: [6, 11], side: 2, bias: inward });
  }
  Sound.applause(0, 1.8, 0.08);
}
function onBanner() {
  burst(bannerGroup.localToWorld(V(0, 8.2, 0)), 280, { spread: 5, up: [0, 2.5], side: 2 });
  Sound.applause(0, 1.5, 0.06);
}
function checkTriggers() {
  const front = wrapLen(sim.s + WB + 2.7);
  if (sim.prevFront !== null) {
    const moved = wrapLen(front - sim.prevFront);
    if (moved > 0 && moved < 20) {
      if (wrapLen(S_ARCH - sim.prevFront) < moved) onArch();
      if (wrapLen(S_BANNER - sim.prevFront) < moved) onBanner();
    }
  }
  sim.prevFront = front;
}

function updateBus(dt) {
  if (dt > 0) {
    let a = 0;
    if (sim.mode === 'drive') {
      const d = wrapLen(S_STOP - sim.s);
      const target = Math.min(VMAX, Math.sqrt(2 * DEC * d));
      const nv = target < sim.v ? target : Math.min(sim.v + ACC * dt, target);
      a = (nv - sim.v) / dt; sim.v = nv;
      const step = sim.v * dt;
      if ((step >= d && d < 10) || d < 0.03) {
        sim.s = S_STOP; sim.v = 0; sim.mode = 'dwell'; sim.dwellT = 0; onArrive();
      } else sim.s = wrapLen(sim.s + step);
    } else if (sim.mode === 'dwell') {
      sim.dwellT += dt;
      if (sim.dwellT > DWELL - 1.6 && sim.dwellT - dt <= DWELL - 1.6) Sound.bell();
      if (sim.dwellT > DWELL - 2.2 && sim.indUntil < time) sim.indUntil = time + 5.5;
      if (sim.dwellT > DWELL) sim.mode = 'depart';
    } else {
      const nv = Math.min(sim.v + ACC * dt, VMAX);
      a = (nv - sim.v) / dt; sim.v = nv;
      sim.s = wrapLen(sim.s + sim.v * dt);
      if (wrapLen(sim.s - S_STOP) > 25 && wrapLen(sim.s - S_STOP) < LR / 2) sim.mode = 'drive';
    }
    sim.a += (a - sim.a) * Math.min(1, dt * 4);
    const doorTarget = sim.mode === 'dwell' && sim.dwellT > 0.7 && sim.dwellT < DWELL - 1.6 ? 1 : 0;
    sim.doorO = clamp(sim.doorO + Math.sign(doorTarget - sim.doorO) * dt / 0.9, 0, 1);
    sim.wheelA += sim.v * dt / 0.5;
  }

  const uR = wrap01(sim.s / LR), uF = wrap01((sim.s + WB) / LR);
  laneR.getPointAt(uR, tA); laneR.getPointAt(uF, tB);
  const heading = Math.atan2(tB.x - tA.x, tB.z - tA.z);
  bus.root.position.copy(tA);
  bus.root.rotation.y = heading;
  laneR.getTangentAt(uF, tC);
  const steer = angDiff(Math.atan2(tC.x, tC.z), heading);
  for (const s of bus.steers) s.rotation.y = steer;
  for (const w of bus.spins) w.rotation.x = sim.wheelA;

  if (dt > 0) {
    const yawRate = sim.prevHeading === null ? 0 : angDiff(heading, sim.prevHeading) / dt;
    sim.prevHeading = heading;
    const targetRoll = clamp(yawRate * sim.v * 0.011, -0.05, 0.05);
    const targetPitch = clamp(-sim.a * 0.008, -0.025, 0.025);
    sim.roll += (targetRoll - sim.roll) * Math.min(1, dt * 3);
    sim.pitch += (targetPitch - sim.pitch) * Math.min(1, dt * 3);
  }
  bus.sway.rotation.set(sim.pitch, 0, sim.roll);

  const out = smooth(0, 0.35, sim.doorO), slide = smooth(0.2, 1, sim.doorO);
  for (const l of bus.doors) {
    const u = l.userData;
    l.position.x = u.x0 - 0.14 * out;
    l.position.z = u.z0 + u.sgn * (u.lw - 0.04) * slide;
  }

  const braking = sim.mode === 'dwell' || sim.a < -0.25;
  bus.brake.emissiveIntensity = braking ? 2.6 : 0.5;
  bus.indL.emissiveIntensity = time < sim.indUntil && (time * 1.6) % 1 < 0.5 ? 3 : 0.1;

  bus.root.updateMatrixWorld(true);
  busInv.copy(bus.body.matrixWorld).invert();
  const tR = laneR.getUtoTmapping(uR);
  const t0 = tR + (-1.6 - AX_R) / Lc;
  poles.forEach((pl, k) => {
    bus.body.localToWorld(tBase.set(k ? -0.32 : 0.32, Y1 + 0.45, -1.6));
    poleTip(tBase, wires[k], t0, tTip);
    pl.g.position.copy(tBase);
    pl.g.lookAt(tTip);
    pl.g.updateMatrixWorld(true);
    const ra = pl.rope.geometry.attributes.position;
    pl.g.localToWorld(tmp.set(0, 0, POLE_LEN * 0.8)); ra.setXYZ(0, tmp.x, tmp.y, tmp.z);
    const p0 = tmp.clone();
    bus.body.localToWorld(tmp.set(k ? -0.32 : 0.32, Y1 + 0.05, -5.95)); ra.setXYZ(2, tmp.x, tmp.y, tmp.z);
    tmp.add(p0).multiplyScalar(0.5); tmp.y -= 0.35; ra.setXYZ(1, tmp.x, tmp.y, tmp.z);
    ra.needsUpdate = true;
    if (dt > 0) {
      pl.sparkT -= dt;
      if (pl.sparkT <= 0 && Math.random() < 0.012 * (sim.v / VMAX)) pl.sparkT = 0.07;
      pl.spark.visible = pl.sparkT > 0;
      if (pl.spark.visible) pl.spark.scale.setScalar(0.6 + Math.random() * 0.8);
    }
  });

  bus.root.localToWorld(busCenter.set(0, 1.4, WB / 2));
  busFwd.set(Math.sin(heading), 0, Math.cos(heading));
}

function updateWorld(dt) {
  const t = time;
  if (dt > 0) updateSea(t);
  updateArch(t);
  updateBunting(t);
  for (const f of flags) f.rotation.x = Math.sin(t * 3 + f.userData.ph) * 0.35;
  if (darSig) {
    darSig.flagPos.forEach((p, i) => { _q.setFromAxisAngle(XAXIS, Math.sin(t * 3.2 + i * 0.8) * 0.4); darSig.sig.setMatrixAt(i, _m4.compose(p, _q, _one)); });
    darSig.sig.instanceMatrix.needsUpdate = true;
  }
  for (const s of ships) {
    s.g.position.y = WATER_Y + Math.sin(t * 0.7 + s.ph) * 0.06;
    s.g.rotation.x = Math.sin(t * 0.5 + s.ph) * s.roll;
    s.g.rotation.z = Math.sin(t * 0.37 + s.ph) * s.roll * 0.5;
  }
  for (const y of yachts) {
    if (y.moored) {
      y.g.position.y = WATER_Y + Math.sin(t * 1.1 + y.ph) * 0.07;
      y.g.rotation.x = Math.sin(t * 0.9 + y.ph) * 0.03;
    } else {
      const a = y.ph + t * y.w;
      y.g.position.set(y.cx + Math.cos(a) * y.r, waveH(y.cx, y.cz, t) + 0.05, y.cz + Math.sin(a) * y.r);
      const dx = -Math.sin(a) * Math.sign(y.w), dz = Math.cos(a) * Math.sign(y.w);
      y.g.rotation.order = 'YXZ';
      y.g.rotation.set(0.22 * Math.sign(y.w) + Math.sin(t * 1.3 + y.ph) * 0.04, Math.atan2(-dz, dx), Math.sin(t * 1.1 + y.ph) * 0.03);
    }
  }
  for (const c of cranes) {
    const k = (Math.sin(t * 0.16 + c.ph) + 1) / 2;
    c.trolley.position.x = -12 + k * 46;
    c.hoist.position.y = -6 - 10 * (0.5 + 0.5 * Math.sin(t * 0.32 + c.ph));
    const a = c.cables.geometry.attributes.position;
    a.setXYZ(0, -1, 0, -1.2); a.setXYZ(1, -1, c.hoist.position.y, -2.5); a.setXYZ(2, 1, 0, 1.2); a.setXYZ(3, 1, c.hoist.position.y, 2.5);
    a.needsUpdate = true;
  }
  for (const b of beams) b.rotation.y = t * 0.9;
  for (const c of candles) {
    c.f.scale.set(1 + Math.sin(t * 17 + c.ph) * 0.12, 1 + Math.sin(t * 23 + c.ph) * 0.22 + Math.random() * 0.08, 1);
    c.f.rotation.z = Math.sin(t * 5 + c.ph) * 0.12 + WIND.x * 0.1;
  }
  for (const c of clouds) { c.position.x += dt * 1.6; if (c.position.x > 340) c.position.x = -340; }
  for (const gl of gulls) {
    const a = gl.ph + t * gl.w;
    gl.g.position.set(gl.cx + Math.cos(a) * gl.r, gl.h + Math.sin(t * 0.5 + gl.ph) * 1.5, gl.cz + Math.sin(a) * gl.r);
    const sgn = Math.sign(gl.w);
    gl.g.rotation.set(0, Math.atan2(-Math.sin(a) * sgn, Math.cos(a) * sgn), -sgn * 0.35);
    const flap = Math.sin(t * 0.6 + gl.ph) > 0.2 ? 1 : 0;
    const ang = flap * Math.sin(t * 9 + gl.ph) * 0.6 + 0.12;
    gl.wings[0].rotation.z = -ang; gl.wings[1].rotation.z = ang;
  }
  {
    const a = t * 0.022 + 1.0, h = hotAir;
    h.g.position.set(25 + Math.cos(a) * 125, 54 + Math.sin(t * 0.21) * 3, 10 + Math.sin(a) * 125);
    h.g.rotation.y = t * 0.03;
    h.banner.rotation.x = Math.sin(t * 0.8) * 0.08;
    if (dt > 0) { h.burnT -= dt; if (h.burnT < -6 - Math.random() * 4) h.burnT = 1.2; }
    h.flame.visible = h.burnT > 0;
    if (h.flame.visible) h.flame.scale.set(1, 0.8 + Math.random() * 0.5, 1);
  }
  if (dt > 0) ferry.position.set(360, WATER_Y, 520 - ((t * 4.5 + 300) % 1040));
  for (const c of cars) {
    c.s = ((c.s - c.v * dt) % LL + LL) % LL;
    const u = c.s / LL;
    laneL.getPointAt(u, tA); laneL.getTangentAt(u, tC);
    c.root.position.copy(tA);
    c.root.rotation.y = Math.atan2(-tC.x, -tC.z);
    for (const w of c.wheels) w.rotation.x += c.v * dt / 0.33;
  }
  // strollers on the Orłowo pier
  for (const p of people) {
    const u = p.userData;
    if (u.pierX === undefined) continue;
    if (dt > 0) { u.pierX += u.pierDir * 1.2 * dt; if (u.pierX > 236) u.pierDir = -1; if (u.pierX < 90) u.pierDir = 1; }
    p.position.set(u.pierX, 1.68, -160 + u.pierLane);
    p.rotation.y = u.pierDir > 0 ? Math.PI / 2 : -Math.PI / 2;
    const sw = Math.sin(t * 5 + u.ph);
    u.legs[0].rotation.x = sw * 0.5; u.legs[1].rotation.x = -sw * 0.5;
    u.arms[0].rotation.x = -sw * 0.4; u.arms[1].rotation.x = sw * 0.4;
  }
  updateConfetti(dt);
}
burst(tmp.copy(stopWorld).addScaledVector(stopRight, 6.2).setY(3), 450);

/* ------------------------------------------------------------------ *
 *  Cameras: cinematic shot list, chase, free orbit
 * ------------------------------------------------------------------ */
const MODES = ['cinematic', 'chase', 'free'];
const MODE_LABEL = { cinematic: '🎥 Cinematic', chase: '🚎 Chase', free: '🖐 Free orbit' };
const SHOTS = ['orbit', 'trackside', 'side', 'drone'];
const SHOT_LEN = { orbit: 14, trackside: 18, side: 10, drone: 11 };
let mode = 'cinematic', camTime = 0, camInit = false, shotIdx = 0, shotT = 0, passedT = -1;
const desired = V(0, 0, 0), lookT = V(0, 0, 0), curLook = V(0, 0, 0), lastTarget = V(0, 0, 0), trackPos = V(0, 0, 0), leftV = V(0, 0, 0);
const camBtn = document.getElementById('camBtn'), pauseBtn = document.getElementById('pauseBtn'), soundBtn = document.getElementById('soundBtn');
function setMode(m) {
  mode = m; camBtn.textContent = MODE_LABEL[m];
  if (m === 'free') { controls.target.copy(curLook); lastTarget.copy(busCenter); }
  if (m === 'cinematic') startShot(0);
}
function startShot(i) {
  shotIdx = i; shotT = 0; camInit = false; passedT = -1;
  if (SHOTS[i] === 'trackside') {
    const u = wrapLen(sim.s + 62) / LR, p = laneR.getPointAt(u), t = laneR.getTangentAt(u);
    trackPos.set(p.x + t.z * 10.4, 1.7, p.z - t.x * 10.4);      // outer verge, ~8.6 m from the centre line
  }
}
controls.addEventListener('start', () => { if (mode !== 'free') setMode('free'); });
camBtn.onclick = () => setMode(MODES[(MODES.indexOf(mode) + 1) % MODES.length]);
let paused = false;
function togglePause() { paused = !paused; pauseBtn.textContent = paused ? '▶ Play' : '⏸ Pause'; }
pauseBtn.onclick = togglePause;
function toggleSound() { const on = Sound.toggle(); soundBtn.textContent = on ? '🔊 Sound on' : '🔇 Sound'; }
soundBtn.onclick = toggleSound;
addEventListener('keydown', e => {
  if (e.code === 'KeyC') camBtn.onclick();
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
});

function updateCamera(dt) {
  let fov = 45;
  if (mode === 'free') {
    tmp.copy(busCenter).sub(lastTarget);
    controls.target.add(tmp); camera.position.add(tmp);
    lastTarget.copy(busCenter);
    controls.update();
    curLook.copy(controls.target);
  } else {
    camTime += dt;
    let snap = false;
    leftV.set(busFwd.z, 0, -busFwd.x);
    if (mode === 'cinematic') {
      shotT += dt;
      const shot = SHOTS[shotIdx];
      if (shot === 'orbit') {
        // stays above the wire-support arms (~6.3 m) so the camera never clips through them
        const a = camTime * 0.11 + 2.2, R = 16 + 3 * Math.sin(camTime * 0.17), h = 6.5 + 1.1 * Math.sin(camTime * 0.09 + 1);
        desired.set(busCenter.x + Math.sin(a) * R, busCenter.y + h, busCenter.z + Math.cos(a) * R);
        lookT.copy(busCenter).addScaledVector(busFwd, 1.5);
      } else if (shot === 'trackside') {
        desired.copy(trackPos); lookT.copy(busCenter); fov = 32; snap = true;
        if (passedT < 0 && tmp.subVectors(busCenter, trackPos).dot(busFwd) > 4) passedT = shotT;
      } else if (shot === 'side') {
        desired.copy(busCenter).addScaledVector(leftV, 10.5).addScaledVector(busFwd, 2); desired.y += 0.7;
        lookT.copy(busCenter).addScaledVector(busFwd, 1.2); lookT.y += 0.9; fov = 40;
      } else {
        desired.copy(busCenter).addScaledVector(busFwd, -24).addScaledVector(leftV, 10); desired.y += 17;
        lookT.copy(busCenter).addScaledVector(busFwd, 14); fov = 50;
      }
      const done = shot === 'trackside' ? (passedT >= 0 && shotT - passedT > 2.2) || shotT > SHOT_LEN.trackside : shotT > SHOT_LEN[shot];
      if (done) startShot((shotIdx + 1) % SHOTS.length);
    } else {
      desired.copy(busCenter).addScaledVector(busFwd, -15); desired.y += 3.0;     // below the overhead wires
      lookT.copy(busCenter).addScaledVector(busFwd, 8); lookT.y += 0.6;
    }
    if (!camInit) { camera.position.copy(desired); curLook.copy(lookT); camera.fov = fov; camInit = true; }
    if (snap) camera.position.copy(desired); else camera.position.lerp(desired, 1 - Math.exp(-dt * 2.2));
    curLook.lerp(lookT, 1 - Math.exp(-dt * 5));
    camera.lookAt(curLook);
    controls.target.copy(curLook);
  }
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov += (fov - camera.fov) * (1 - Math.exp(-dt * 3)); camera.updateProjectionMatrix(); }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
// Pre-roll: quietly simulate the bus pulling away and reaching cruising speed (~12 s, ending at START_S),
// so the bus balloons are already trailing naturally when the first frame is drawn.
{
  const dt = 1 / 60, busB = balloonGroups.get('bus');
  sim.s = wrapLen(START_S - (0.5 * VMAX * VMAX / ACC + VMAX * (12 - VMAX / ACC))); sim.v = 0;
  for (let k = 0; k < 12 * 60; k++) { time += dt; updateBus(dt); updateBalloons(dt, busB, [busB]); }
  sim.prevFront = null;
  msgStart = time;
}
const clock = new THREE.Clock();
document.getElementById('msg').remove();
renderer.setAnimationLoop(() => {
  const raw = Math.min(clock.getDelta(), 0.05);
  const dt = paused ? 0 : raw;
  time += dt;
  updateBus(dt);
  if (dt > 0) checkTriggers();
  updatePeople(dt);
  updateBalloons(dt);
  updateWorld(dt);
  drawDestination(time);
  Sound.update(crowdLevel);
  updateCamera(raw);
  renderer.render(scene, camera);
});
window.__bus24 = { Sound, sim, setMode, camera, controls, S_STOP, bus, togglePause, startShot, balloonList, busInv, renderer, center, U_BANNER, U_ARCH, get time() { return time; } };
