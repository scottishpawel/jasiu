<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Asad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root { --lime:#6ad41f; --race:'Russo One',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  html,body { margin:0; height:100%; overflow:hidden; background:#2a1748; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  canvas { display:block; touch-action:none; }

  /* ---------- title ---------- */
  #hud { position:fixed; left:0; right:0; top:3vh; text-align:center; pointer-events:none; padding:0 16px; }
  #hud .kicker { color:#fff; font-family:var(--race); font-size:clamp(10px,1.5vw,13px); letter-spacing:.34em; text-transform:uppercase; opacity:.92; text-shadow:0 2px 10px rgba(40,0,60,.6); }
  #hud h1 { margin:6px 0 0; font-size:clamp(30px,7vw,84px); font-weight:900; line-height:1; font-style:italic;
    background:linear-gradient(90deg,#ffe14d,#ff7ab8,#8cf542,#5fd3ff,#ffe14d); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 14px rgba(40,0,70,.55)); animation:sheen 6s linear infinite; }
  @keyframes sheen { to { background-position:-200% 0; } }
  #hud .sub { color:#fff; font-size:clamp(13px,2vw,18px); font-weight:600; margin-top:8px; text-shadow:0 2px 10px rgba(40,0,60,.7); }

  /* ---------- stunt pop-ups ---------- */
  #pop { position:fixed; left:0; right:0; top:31%; text-align:center; pointer-events:none; padding:0 16px;
    font-family:var(--race); font-size:clamp(30px,6.8vw,84px); font-style:italic; line-height:1; opacity:0;
    color:#ffe14d; -webkit-text-stroke:2px #2a0f4a; filter:drop-shadow(0 6px 0 #2a0f4a) drop-shadow(0 14px 22px rgba(0,0,0,.35)); }
  #pop.pink { color:#ff7ab8; } #pop.lime { color:#a8ff5c; } #pop.blue { color:#7fdcff; }
  #pop.show { animation:pop 1.7s cubic-bezier(.2,.9,.3,1.25) both; }
  @keyframes pop {
    0% { opacity:0; transform:scale(.2) rotate(-14deg); }
    16% { opacity:1; transform:scale(1.14) rotate(-5deg); }
    28% { transform:scale(1) rotate(-5deg); }
    78% { opacity:1; transform:scale(1) rotate(-5deg); }
    100% { opacity:0; transform:translateY(-40px) scale(.96) rotate(-5deg); }
  }

  /* ---------- handlebar dashboard ---------- */
  #dash { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:flex-end; gap:14px;
    padding:14px 16px 12px; border-radius:28px; box-sizing:border-box; max-width:calc(100% - 32px);
    background-color:#17171e;
    background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%),
      repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 3px,transparent 3px 6px),
      repeating-linear-gradient(-45deg,rgba(0,0,0,.30) 0 3px,transparent 3px 6px);
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 0 5px rgba(0,0,0,.35),0 20px 44px rgba(10,0,30,.6),inset 0 1px 0 rgba(255,255,255,.14); }
  #dash::before { content:''; position:absolute; left:26px; right:26px; top:0; height:3px; border-radius:0 0 4px 4px;
    background:linear-gradient(90deg,transparent,var(--lime) 20%,var(--lime) 80%,transparent); box-shadow:0 0 12px var(--lime); }
  #dash .plate { position:absolute; top:-10px; left:50%; transform:translateX(-50%); white-space:nowrap;
    font:9px var(--race); letter-spacing:.32em; color:#c8ff9a; background:#15151b; padding:3px 12px; border-radius:999px; border:1px solid rgba(106,212,31,.55); }
  #dash .screw { position:absolute; width:7px; height:7px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#c9ccd4,#55585f); box-shadow:inset 0 0 0 1px rgba(0,0,0,.4); }
  #dash .screw::after { content:''; position:absolute; left:1px; right:1px; top:3px; height:1px; background:#2a2b30; transform:rotate(35deg); }

  .btn { --c1:#ff5fa2; --c2:#9b3cff; --edge:#55167f; position:relative; overflow:hidden; display:flex; align-items:center; gap:11px;
    min-width:176px; padding:9px 18px 9px 9px; border:0; border-radius:17px; cursor:pointer; color:#fff; text-align:left;
    font-family:var(--race); -webkit-tap-highlight-color:transparent; margin-bottom:6px;
    background:linear-gradient(160deg,var(--c1),var(--c2));
    box-shadow:0 6px 0 var(--edge),0 12px 20px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -5px 12px rgba(0,0,0,.22);
    transition:transform .08s ease,box-shadow .08s ease,filter .2s; }
  .btn:hover { filter:brightness(1.1) saturate(1.1); }
  .btn:active { transform:translateY(5px); box-shadow:0 1px 0 var(--edge),0 4px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 8px rgba(0,0,0,.25); }
  .btn:focus-visible, #turbo:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .btn::after { content:''; position:absolute; top:-10%; bottom:-10%; width:38%; left:-70%; transform:skewX(-20deg);
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent); animation:shine 5s ease-in-out infinite; pointer-events:none; }
  #boom::after { animation-delay:2.5s; }
  @keyframes shine { 0%,72% { left:-70%; } 100% { left:140%; } }
  .btn .ic { width:46px; height:46px; flex:none; border-radius:13px; display:grid; place-items:center;
    background:rgba(0,0,0,.30); box-shadow:inset 0 2px 7px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.25); }
  .btn .tx { white-space:nowrap; }
  .btn .tx b { display:flex; align-items:center; gap:8px; font-weight:400; font-size:15px; letter-spacing:.07em; }
  .btn .tx small { display:block; font:700 10px system-ui,sans-serif; letter-spacing:.17em; text-transform:uppercase; opacity:.86; margin-top:3px; }

  #tune .vinyl { animation:spin 1.8s linear infinite; animation-play-state:paused; }
  #tune.on .vinyl { animation-play-state:running; }
  #tune.on { --c1:#ff7ab8; --c2:#c23cff; box-shadow:0 6px 0 var(--edge),0 0 26px rgba(255,95,162,.75),inset 0 2px 0 rgba(255,255,255,.45),inset 0 -5px 12px rgba(0,0,0,.22); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .eq { display:none; align-items:flex-end; gap:2px; height:13px; }
  #tune.on .eq { display:inline-flex; }
  .eq i { width:3px; background:#fff; border-radius:2px; animation:eq .7s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay:-.25s; } .eq i:nth-child(3) { animation-delay:-.5s; } .eq i:nth-child(4) { animation-delay:-.15s; }
  @keyframes eq { from { height:3px; } to { height:13px; } }

  #boom { --c1:#3150c9; --c2:#11154a; --edge:#070923; box-shadow:0 6px 0 var(--edge),0 12px 20px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,210,63,.45),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -5px 12px rgba(0,0,0,.25); }
  #boom .burst { animation:twinkle 2.2s ease-in-out infinite; transform-origin:50% 50%; }
  #boom:hover .burst { animation-duration:.7s; }
  @keyframes twinkle { 0%,100% { transform:scale(.88) rotate(0); } 50% { transform:scale(1.06) rotate(22deg); } }

  .gauge { position:relative; width:150px; height:124px; flex:none; }
  .gauge > svg { position:absolute; left:0; top:0; width:150px; height:96px; overflow:visible; }
  .gauge text { font-family:var(--race); fill:#fff; paint-order:stroke; stroke:#15151b; stroke-width:3px; }
  #turbo { position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:62px; height:62px; border-radius:50%; border:0; cursor:pointer;
    display:grid; place-items:center; align-content:center; gap:1px; color:#fff; font:10px var(--race); letter-spacing:.1em; -webkit-tap-highlight-color:transparent;
    background:radial-gradient(circle at 36% 30%,#ff9a8a,#e4162b 55%,#86040f);
    box-shadow:0 0 0 4px #24242c,0 0 0 6px #9a9ea8,0 4px 0 6px #4a4d55,0 12px 20px rgba(0,0,0,.55),inset 0 -5px 9px rgba(0,0,0,.35),inset 0 3px 4px rgba(255,255,255,.45);
    transition:transform .08s; }
  #turbo:active { transform:translateX(-50%) translateY(3px); }
  #turbo::before { content:''; position:absolute; inset:-6px; border-radius:50%; animation:pulse 1.8s ease-out infinite; pointer-events:none; }
  @keyframes pulse { from { box-shadow:0 0 0 0 rgba(255,70,70,.65); } to { box-shadow:0 0 0 16px rgba(255,70,70,0); } }
  #turbo.on { background:radial-gradient(circle at 36% 30%,#fff7b0,#ffae00 55%,#c24f00); animation:rumble .09s linear infinite; }
  #turbo.on::before { animation-duration:.6s; }
  @keyframes rumble { 0% { transform:translateX(-50%) translate(0,0); } 50% { transform:translateX(-50%) translate(1px,-1px); } 100% { transform:translateX(-50%) translate(-1px,1px); } }

  .spark { position:fixed; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:5; animation:spark .75s cubic-bezier(.1,.7,.3,1) forwards; }
  @keyframes spark { from { transform:translate(-50%,-50%) scale(1); opacity:1; } to { transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2); opacity:0; } }

  @media (max-width:600px) {
    #dash { gap:8px; padding:14px 10px 10px; border-radius:22px; }
    .btn { flex-direction:column; gap:5px; min-width:0; width:92px; padding:9px 6px 8px; text-align:center; }
    .btn .ic { width:40px; height:40px; }
    .btn .tx b { font-size:11px; justify-content:center; letter-spacing:.04em; }
    .btn .tx small { display:none; }
    .gauge { width:120px; height:112px; }
    #tune.on .eq { display:none; }
    .gauge > svg { width:120px; height:77px; }
    #turbo { width:52px; height:52px; font-size:8px; }
    #dash .plate { font-size:8px; letter-spacing:.2em; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="kicker">Full throttle into another year</div>
  <h1>Happy Birthday, Asad!</h1>
  <div class="sub">May every road ahead be open, smooth and fast.</div>
</div>
<div id="pop"></div>

<div id="dash">
  <div class="plate">ASAD &middot; BIRTHDAY EDITION</div>
  <span class="screw" style="left:12px;top:12px"></span><span class="screw" style="right:12px;top:12px"></span>
  <button id="tune" class="btn" aria-pressed="false">
    <span class="ic">
      <svg class="vinyl" viewBox="0 0 48 48" width="36" height="36" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="#0d0d12"/>
        <circle cx="24" cy="24" r="18.5" fill="none" stroke="#2d2d38" stroke-width="1"/>
        <circle cx="24" cy="24" r="15" fill="none" stroke="#2d2d38" stroke-width="1"/>
        <circle cx="24" cy="24" r="9" fill="#ffd23f"/>
        <path d="M24 15a9 9 0 0 1 9 9h-9z" fill="#ff4f8b"/>
        <path d="M24 33a9 9 0 0 1-9-9h9z" fill="#ff4f8b"/>
        <circle cx="24" cy="24" r="2" fill="#0d0d12"/>
        <path d="M9 17A16 16 0 0 1 17 9" stroke="rgba(255,255,255,.55)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="tx"><b><span class="lbl">PLAY TUNE</span><span class="eq"><i></i><i></i><i></i><i></i></span></b><small>Happy Birthday</small></span>
  </button>

  <div class="gauge">
    <svg viewBox="0 0 150 96" aria-hidden="true">
      <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#6ad41f"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff3b3b"/></linearGradient></defs>
      <path d="M29.97 88A52 52 0 1 1 120.03 88" fill="none" stroke="#2a2a35" stroke-width="9" stroke-linecap="round"/>
      <path id="gfill" d="M29.97 88A52 52 0 1 1 120.03 88" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="217.8" stroke-dashoffset="217.8"/>
      <g id="ticks" stroke="#c9ccd4" stroke-linecap="round"></g>
      <g id="needle"><line x1="75" y1="66" x2="75" y2="20" stroke="#ff3b3b" stroke-width="2.6" stroke-linecap="round"/></g>
      <text id="kmh" x="75" y="47" text-anchor="middle" font-size="20">0</text>
      <text x="75" y="57" text-anchor="middle" font-size="6.5" letter-spacing="2">KM/H</text>
    </svg>
    <button id="turbo" aria-label="Turbo boost">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 2 4.5 13.5H11L9.5 22 19.5 9.5H13z" fill="#fff"/></svg>
      <span>TURBO</span>
    </button>
  </div>

  <button id="boom" class="btn">
    <span class="ic">
      <svg class="burst" viewBox="0 0 48 48" width="38" height="38" aria-hidden="true">
        <g stroke-linecap="round" stroke-width="3">
          <path d="M31 24h12M24 17V5M17 24H5M24 31v12" stroke="#ffd23f"/>
          <path d="M29 19l5.6-5.6M19 19l-5.6-5.6M19 29l-5.6 5.6M29 29l5.6 5.6" stroke="#ff7ab8"/>
        </g>
        <g fill="#fff"><circle cx="43" cy="24" r="2"/><circle cx="24" cy="5" r="2"/><circle cx="5" cy="24" r="2"/><circle cx="24" cy="43" r="2"/></g>
        <path d="M24 18.5l1.7 3.8 3.8 1.7-3.8 1.7-1.7 3.8-1.7-3.8-3.8-1.7 3.8-1.7z" fill="#fff"/>
      </svg>
    </span>
    <span class="tx"><b>FIREWORKS</b><small>Light up the sky</small></span>
  </button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ------------------------------------------------------------------ setup */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = 0xff9f7e;
scene.fog = new THREE.Fog(HORIZON, 22, 120);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 800);
camera.position.set(4.6, 2.1, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.8;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.5;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.45, 0.88));
composer.addPass(new OutputPass());

/* -------------------------------------------------------------- helpers */
const UP = new THREE.Vector3(0, 1, 0);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = t => t * t * (3 - 2 * t);
const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);
const flat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.6, metalness: 0.05, ...o });

function add(geo, mat, parent, pos, rot, scl) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (scl) m.scale.set(...scl);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
// cylinder stretched between two points
function limb(a, b, r, mat, parent, seg = 6) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const d = B.clone().sub(A), len = d.length();
  const m = add(new THREE.CylinderGeometry(r, r, len, seg), mat, parent);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  return m;
}
// side-profile extrusion (x forward, y up) centred on z, with optional width taper
function profile(points, depth, mat, parent, taper) {
  const shape = new THREE.Shape(points.map(p => new THREE.Vector2(p[0], p[1])));
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  g.translate(0, 0, -depth / 2);
  if (taper) {
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setZ(i, p.getZ(i) * taper(p.getX(i), p.getY(i)));
  }
  g.computeVertexNormals();
  return add(g, mat, parent);
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* ---------------------------------------------------------------- sky */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    top: { value: new THREE.Color(0x1a1347) },
    mid: { value: new THREE.Color(0x8a3f9c) },
    bot: { value: new THREE.Color(HORIZON) },
  },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, mid, bot; varying vec3 vP;
    void main(){ float h = vP.y;
      vec3 c = h < 0.0 ? bot : (h < 0.22 ? mix(bot, mid, smoothstep(0.0,0.22,h)) : mix(mid, top, smoothstep(0.22,0.75,h)));
      gl_FragColor = vec4(c,1.0);
      #include <colorspace_fragment>
    }`,
})));
{ // stars
  const n = 600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, y = rand(0.35, 1), r = Math.sqrt(1 - y * y);
    pos.set([Math.cos(th) * r * 380, y * 380, Math.sin(th) * r * 380], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8 })));
}
{ // low sun
  const sunMat = new THREE.MeshBasicMaterial({ fog: false });
  sunMat.color.setRGB(3.2, 2.2, 1.2);
  const sun = new THREE.Mesh(new THREE.CircleGeometry(16, 24), sunMat);
  sun.position.set(240, 22, -210);
  sun.lookAt(0, 0, 0);
  scene.add(sun);
}

/* -------------------------------------------------------------- lights */
scene.add(new THREE.HemisphereLight(0xffd6ea, 0x3b2a55, 1.1));
const sunLight = new THREE.DirectionalLight(0xffc89a, 2.6);
sunLight.position.set(16, 20, -14);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 70 });
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);
const fill = new THREE.DirectionalLight(0x9fb8ff, 0.6);
fill.position.set(-10, 8, 12);
scene.add(fill);

/* -------------------------------------------------------- ground + road */
const groundTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5a9440'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    g.fillStyle = pick(['#4f8638', '#64a248', '#6aa84b', '#4a7d35', '#7bb352']);
    const s = rand(6, 26); g.fillRect(rand(0, w), rand(0, h), s, s * rand(0.4, 1));
  }
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(50, 50);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const ROAD_TILE = 6;
const roadTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#35333f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) { g.fillStyle = Math.random() < .5 ? '#3d3b48' : '#2e2c37'; g.fillRect(rand(0, w), rand(0, h), 3, 3); }
  g.fillStyle = '#f2f0ea'; g.fillRect(0, 7, w, 6); g.fillRect(0, h - 13, w, 6);
  g.fillStyle = '#ffd23f'; g.fillRect(0, h / 2 - 3, w * 0.55, 6);
});
roadTex.wrapS = THREE.RepeatWrapping;
roadTex.repeat.set(400 / ROAD_TILE, 1);
const road = new THREE.Mesh(new THREE.PlaneGeometry(400, 4.6), new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.85 }));
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
road.receiveShadow = true;
scene.add(road);

/* ------------------------------------------- scrolling world (seamless) */
const LOOP = 240;
const scrollers = [];
function scroll(obj, x, factor = 1) {
  obj.userData.sx = x; obj.userData.f = factor;
  scene.add(obj); scrollers.push(obj);
  return obj;
}

function burst(c, { n = 170, speed = 8, size = 1.1, gravity = 3, life = 2.3, colors = null, shape = 'sphere' } = {}) {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), vel = [];
  const normal = new THREE.Vector3().randomDirection(), u = new THREE.Vector3().crossVectors(normal, UP).normalize(), w = new THREE.Vector3().crossVectors(normal, u);
  for (let i = 0; i < n; i++) {
    pos.set([c.x, c.y, c.z], i * 3);
    let v;
    if (shape === 'ring') { const a = i / n * Math.PI * 2; v = u.clone().multiplyScalar(Math.cos(a)).addScaledVector(w, Math.sin(a)).multiplyScalar(speed * rand(0.92, 1)); }
    else if (shape === 'up') { v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y) + 0.5; v.normalize().multiplyScalar(speed * rand(0.4, 1)); }
    else v = new THREE.Vector3().randomDirection().multiplyScalar(speed * rand(0.75, 1));
    vel.push(v);

  }
  const g = new THREE.BufferGeometry();

let actx = null, sfx = null, noiseBuf = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    sfx = actx.createGain(); sfx.gain.value = 0.5; sfx.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
}
function noise(t, dur, freq, vol, type = 'bandpass', q = 1, dest = sfx) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t + dur);
}
function sfxBoom(vol = 0.5) {
  if (!actx) return;
  const t = actx.currentTime;
  noise(t, 1.1, 160, 0.9 * vol, 'lowpass');
  for (let k = 0; k < 9; k++) noise(t + 0.2 + Math.random() * 0.9, 0.05, rand(2500, 6000), 0.35 * vol);
}
function sfxRoar(dur = 2.6) {
  if (!actx) return;
  const t = actx.currentTime;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 4;
  f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.45); f.frequency.exponentialRampToValueAtTime(700, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.08); g.gain.setValueAtTime(0.22, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  f.connect(g).connect(sfx);
  for (const det of [0, 9]) {
    const o = actx.createOscillator(); o.type = 'sawtooth'; o.detune.value = det;
    o.frequency.setValueAtTime(65, t); o.frequency.exponentialRampToValueAtTime(230, t + 0.55); o.frequency.linearRampToValueAtTime(190, t + dur * 0.7); o.frequency.exponentialRampToValueAtTime(80, t + dur);
    o.connect(f); o.start(t); o.stop(t + dur);
  }
  noise(t, 0.9, 1400, 0.18, 'bandpass', 0.7);
}
// synthesized crowd cheer: a swelling crowd bed, "woo!" voices, claps and a whistle
function sfxCheer(vol = 1, dur = 3.2) {
  if (!actx) return;
  const t0 = actx.currentTime + 0.02;
  const out = actx.createGain(); out.gain.value = vol; out.connect(sfx);
  for (let i = 0; i < 7; i++) { // crowd bed: filtered noise sections, each fluttering at its own rate
    const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rand(450, 2600); f.Q.value = rand(0.8, 2);
    const am = actx.createGain(); am.gain.value = 0.7;
    const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = rand(3, 9); lg.gain.value = 0.3;
    lfo.connect(lg).connect(am.gain);
    const g = actx.createGain(), peak = rand(0.1, 0.18);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + rand(0.15, 0.4));
    g.gain.setValueAtTime(peak, t0 + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(am).connect(g).connect(out);
    s.start(t0, rand(0, 1.5)); s.stop(t0 + dur); lfo.start(t0); lfo.stop(t0 + dur);
  }
  const vowels = [[700, 1150], [800, 1250], [350, 900], [550, 1700]]; // ah, ah, oo, eh
  for (let i = 0; i < 12; i++) { // individual "woo!" / "yeah!" shouts
    const st = t0 + rand(0, 0.5), len = rand(0.7, 1.8), f0 = Math.random() < 0.5 ? rand(150, 260) : rand(260, 420);
    const o = actx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 * 0.85, st); o.frequency.exponentialRampToValueAtTime(f0 * 1.25, st + 0.25); o.frequency.exponentialRampToValueAtTime(f0 * 0.9, st + len);
    const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = rand(5, 7); vg.gain.value = f0 * 0.03;
    vib.connect(vg).connect(o.frequency);
    const g = actx.createGain(), lv = rand(0.08, 0.16);
    g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(lv, st + 0.08);
    g.gain.setValueAtTime(lv, st + len * 0.5); g.gain.exponentialRampToValueAtTime(0.0001, st + len);
    const [F1, F2] = pick(vowels);
    for (const [F, q, a] of [[F1, 6, 1], [F2, 8, 0.6]]) {
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = F * rand(0.9, 1.1); bp.Q.value = q;
      const ga = actx.createGain(); ga.gain.value = a;
      o.connect(bp).connect(ga).connect(g);
    }
    g.connect(out);
    o.start(st); o.stop(st + len + 0.05); vib.start(st); vib.stop(st + len + 0.05);
  }
  for (let i = 0; i < 45; i++) // claps
    noise(t0 + 0.1 + Math.pow(Math.random(), 1.6) * (dur - 0.6), 0.03, rand(1200, 2200), rand(0.15, 0.35), 'bandpass', 1.2, out);
  { // a two-tone whistle
    const wt = t0 + rand(0.3, 0.8), o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(2000, wt); o.frequency.exponentialRampToValueAtTime(2800, wt + 0.18); o.frequency.exponentialRampToValueAtTime(2200, wt + 0.6);
    g.gain.setValueAtTime(0.0001, wt); g.gain.exponentialRampToValueAtTime(0.06, wt + 0.04); g.gain.setValueAtTime(0.06, wt + 0.45); g.gain.exponentialRampToValueAtTime(0.0001, wt + 0.65);
    o.connect(g).connect(out); o.start(wt); o.stop(wt + 0.7);
  }
}

// the birthday tune
const NOTES = [[392, .75], [392, .25], [440, 1], [392, 1], [523.25, 1], [493.88, 2],
  [392, .75], [392, .25], [440, 1], [392, 1], [587.33, 1], [523.25, 2],
  [392, .75], [392, .25], [783.99, 1], [659.25, 1], [523.25, 1], [493.88, 1], [440, 2],
  [698.46, .75], [698.46, .25], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 3]];
let master = null, tuneOn = false, tuneTimer = 0;
function note(f, t, dur) {
  for (const [type, mult, vol] of [['triangle', 1, 0.22], ['sine', 0.5, 0.12], ['sine', 2, 0.03]]) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f * mult;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.97);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur);
  }
}
function playTune() {
  const beat = 0.42; let t = actx.currentTime + 0.08;
  for (const [f, d] of NOTES) { note(f, t, d * beat); t += d * beat; }
  for (let k = 0; k < 3; k++) setTimeout(() => tuneOn && launchRocket(), k * 450 + 150);
  tuneTimer = setTimeout(() => tuneOn && playTune(), (t - actx.currentTime + 0.8) * 1000);
}

  popup(LAND_LINES[landIdx++ % LAND_LINES.length], 'pink');
  sfxCheer(1);
  for (let k = 0; k < 3; k++) setTimeout(() => launchRocket(), 200 + k * 250);
}

function tick() {
  const realDt = Math.min(clock.getDelta(), 0.05);
  // slow motion around the top of each jump
  const tsTarget = jump.state === 'air' ? 1 - 0.68 * Math.pow(Math.sin(Math.PI * jump.p), 2) : 1;
  ts += (tsTarget - ts) * Math.min(1, realDt * 10);
  const dt = realDt * ts;
  time += dt;

  // speed: auto turbo into the ramps, plus the TURBO button
  userTurbo -= realDt;
  autoTurbo = jump.state === 'air' || jump.sinceLand < 0.8 || ramps.some(r => r.position.x > 0 && r.position.x < 42);
  const target = (autoTurbo || userTurbo > 0) ? TURBO_SPEED : BASE_SPEED;
  speed += (target - speed) * Math.min(1, dt * 1.6);
  turboAmt = clamp((speed - BASE_SPEED) / (TURBO_SPEED - BASE_SPEED), 0, 1);
  dist += speed * dt;

  // seamless scrolling
  roadTex.offset.x = (dist / ROAD_TILE) % 1;
  groundTex.offset.x = (dist / 8) % 1;
  for (const o of scrollers) {
    const x = o.userData.sx - dist * o.userData.f;
    o.position.x = ((x % LOOP) + LOOP) % LOOP - LOOP / 2;
  }
  for (const b of bunches) {
    const t = time * 1.6 + b.userData.phase;
    b.rotation.set(Math.sin(t) * 0.12, Math.sin(t * 0.7) * 0.3, Math.cos(t * 0.9) * 0.12 + 0.12);
  }
  for (const f of flames) f.scale.set(1, 1 + Math.sin(time * 18 + f.userData.phase) * 0.25, 1);

  // ramps and jumps
  let groundY = 0, rampPitch = 0, airPitch = 0;
  jump.sinceLand += realDt;
  if (jump.state === 'ground') {
    for (const r of ramps) {
      const xr = r.position.x, uR = RX - xr, uF = FX - xr;
      if (xr > 20) r.userData.done = false;
      if (r.userData.done) continue;
      if (uR > RAMP_L) { r.userData.done = true; if (uR < RAMP_L + 3) launch(); break; }
      if (uF >= 0) { const hR = rampH(uR), hF = rampH(uF); groundY = hR; rampPitch = Math.atan2(hF - hR, FX - RX); }
    }
  }
  if (jump.state === 'air') {
    jump.t += dt; jump.vy -= G * dt; jump.y += jump.vy * dt;
    jump.p = clamp(jump.t / jump.dur, 0, 1);
    const ang = smoother(clamp((jump.p - 0.06) / 0.82, 0, 1)) * Math.PI * 2;
    flip.rotation.set(jump.trick === 1 ? ang : 0, 0, jump.trick === 0 ? ang : 0);
    airPitch = RAMP_ANG * (1 - smooth(clamp(jump.p / 0.35, 0, 1)));
    if (jump.y <= 0) land();
  }

  // weave across the lane (straightens out around the ramps)
  let aFac = jump.state === 'air' ? 0 : 1;
  for (const r of ramps) {
    const d = r.position.x;
    aFac = Math.min(aFac, d >= 30 ? clamp((d - 30) / 12, 0, 1) : d <= -30 ? clamp((-30 - d) / 12, 0, 1) : 0);
  }
  aS += (aFac - aS) * Math.min(1, dt * 1.5);
  weaveT += dt;
  const z = 1.1 * aS * Math.sin(weaveT * 0.55);
  const vz = dt > 0 ? (z - zPrev) / dt : 0; zPrev = z;
  const az = -1.1 * aS * 0.3025 * Math.sin(weaveT * 0.55);
  bikeRoot.position.set(0, jump.state === 'air' ? jump.y : groundY, z);
  bikeRoot.rotation.y = -Math.atan2(vz, speed);
  rollGroup.rotation.x = clamp(az * 0.75, -0.35, 0.35);

  // wheelies on the straights
  wheelie.cool += dt;
  if (!wheelie.on && wheelie.cool > 14 && jump.state === 'ground' && aS > 0.9 && turboAmt < 0.2) { wheelie.on = true; wheelie.t = 0; popup('WHEELIE!'); sfxCheer(0.45, 2.4); }
  let wp = 0;
  if (wheelie.on) { wheelie.t += dt; wp = Math.pow(Math.sin(Math.min(wheelie.t / 3, 1) * Math.PI), 0.6); if (wheelie.t > 3) { wheelie.on = false; wheelie.cool = 0; } }
  pitchPivot.rotation.z = jump.state === 'air' ? airPitch : Math.max(0.33 * wp, rampPitch);

  squash *= Math.exp(-4 * dt);
  body.position.y = Math.sin(time * 17) * 0.006 * (1 + turboAmt) + Math.sin(time * 5.3) * 0.008 - 0.1 * squash * Math.max(0, Math.cos(jump.sinceLand * 16));
  const spin = speed / R_AX * dt;
  frontWheel.rotation.z -= spin; rearWheel.rotation.z -= spin;
  const tuck = jump.state === 'air' ? 0.05 : turboAmt * 0.04;
  rider.position.set(-wp * 0.03 + tuck, Math.sin(time * 9) * 0.006 - tuck * 0.8, 0);
  rider.rotation.x = rollGroup.rotation.x * 0.25;
  head.rotation.set(Math.sin(time * 0.8) * 0.05, Math.sin(time * 0.45) * 0.15, wp * -0.15);
  hat.rotation.set(Math.sin(time * 11) * 0.08, 0, 0.4 + turboAmt * 0.25 + Math.sin(time * 13) * 0.06);
  tailBalloons.rotation.set(Math.sin(time * 2.1) * 0.12, Math.sin(time * 1.3) * 0.2, Math.sin(time * 2.7) * 0.06 - 0.05 - turboAmt * 0.25);

  // turbo flame
  flame.visible = turboAmt > 0.05;
  if (flame.visible) { const s = turboAmt * rand(0.8, 1.15); flame.scale.set(s, s * rand(0.7, 1.3), s); }

  // exhaust
  puffTimer += dt;
  if (puffTimer > 0.06 - turboAmt * 0.03) {
    puffTimer = 0;
    const p = puffs[puffIdx++ % puffs.length];
    exhaustTip.getWorldPosition(p.m.position);
    p.v.set(-speed * 0.6 + rand(-0.5, 0.5), rand(0.3, 0.8), rand(-0.4, 0.4));
    p.life = 0; p.m.visible = true; p.m.scale.setScalar(1);
  }
  for (const p of puffs) {
    if (!p.m.visible) continue;
    p.life += dt;
    p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(1 + p.life * 9);
    p.m.material.opacity = Math.max(0, 0.28 * (1 - p.life / 0.5));
    if (p.life > 0.5) p.m.visible = false;
  }

  // confetti
  for (let i = 0; i < CONF; i++) {
    const c = confData[i];
    c.p.y -= c.vy * dt; c.p.x -= 2.5 * dt; c.p.z += Math.sin(time * 2 + c.ph) * 0.3 * dt;
    c.r.x += c.s.x * dt; c.r.y += c.s.y * dt;
    if (c.p.y < 0) { c.p.y = CY; c.p.x = rand(-CX, CX); }
    if (c.p.x < -CX) c.p.x += 2 * CX;
    dummy.position.copy(c.p); dummy.rotation.copy(c.r);
    dummy.scale.setScalar(clamp((c.p.distanceTo(camera.position) - 1.2) / 1.5, 0, 1));
    dummy.updateMatrix();
    confetti.setMatrixAt(i, dummy.matrix);
  }
  confetti.instanceMatrix.needsUpdate = true;

  // speed lines
  const lineAmt = Math.max(turboAmt, jump.state === 'air' ? 1 : 0);
  lineMat.opacity = lineAmt * 0.5;
  speedLines.visible = lineAmt > 0.02;
  dummy.rotation.set(0, 0, 0);
  for (let i = 0; i < SL; i++) {
    const d = slData[i];
    d.p.x -= speed * 2.2 * dt;
    if (d.p.x < -16) placeLine(d, rand(14, 18));
    dummy.position.set(d.p.x, d.p.y + bikeRoot.position.y * 0.5, d.p.z + z);
    dummy.scale.set(d.len * (0.6 + lineAmt), 1, 1);
    dummy.updateMatrix();
    speedLines.setMatrixAt(i, dummy.matrix);
  }
  speedLines.instanceMatrix.needsUpdate = true;

  // landing shockwave
  shock.userData.t += dt;
  shock.visible = shock.userData.t < 0.7;
  if (shock.visible) { const k = shock.userData.t / 0.7; shock.scale.setScalar(1 + k * 6); shock.material.opacity = 0.85 * (1 - k); }

  // fireworks
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.m.position.y += r.vy * dt; r.vy *= 1 - 0.5 * dt;
    if (r.m.position.y >= r.top) { firework(r.m.position.clone()); scene.remove(r.m); rockets.splice(i, 1); }
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const f = bursts[i]; f.life += dt;
    const pos = f.pts.geometry.attributes.position;
    const drag = 1 - 1.2 * dt;
    for (let k = 0; k < f.vel.length; k++) {
      const v = f.vel[k]; v.multiplyScalar(drag); v.y -= f.gravity * dt;
      pos.setXYZ(k, pos.getX(k) + v.x * dt, pos.getY(k) + v.y * dt, pos.getZ(k) + v.z * dt);
    }
    pos.needsUpdate = true;
    f.pts.material.opacity = clamp((f.max - f.life) / (f.max * 0.45), 0, 1);
    if (f.life > f.max) { scene.remove(f.pts); f.pts.geometry.dispose(); f.pts.material.dispose(); bursts.splice(i, 1); }
  }
  if (Math.random() < realDt * 0.55) launchRocket(Math.random() < 0.7);

  // ---------------- camera
  B.set(0, bikeRoot.position.y, z);
  if (cam.mode === 'manual') {
    if (!cam.dragging) { cam.idle += realDt; if (cam.idle > 7) { cam.mode = 'auto'; nextShot(); } }
    prevTarget.copy(controls.target);
    controls.target.set(0, 0.95 + B.y, z * 0.7);
    camera.position.add(tmpV.subVectors(controls.target, prevTarget));
    controls.update();
    cam.look.copy(controls.target);
    cam.fov = 45;
  } else {
    cam.t += realDt;
    const d = cam.d, t = cam.t;
    // cut to a jump shot as a ramp approaches
    if (!cam.shot.startsWith('jump') && jump.state === 'ground' && ramps.some(r => r.position.x > 0 && r.position.x < 28)) {
      const xr = ramps.find(r => r.position.x > 0 && r.position.x < 28).position.x;
      startShot(cam.jumpAlt++ % 2 ? 'jumpFly' : 'jumpSide');
      cam.d.wx = dist + xr + RAMP_L + 12;
    } else if (cam.shot.startsWith('jump')) {
      if ((jump.landCount > d.lc && jump.sinceLand > 1.8) || t > 14) nextShot();
    } else if (t > SHOT_DUR[cam.shot] || (cam.shot === 'flyby' && d.wx - dist < -16)) nextShot();

    let fov = 45;
    switch (cam.shot) {
      case 'orbit': { const a = d.a0 + t * 0.3; camPos.set(Math.cos(a) * 6.4, 2.1 + B.y * 0.5, B.z + Math.sin(a) * 6.4); lookAt.set(0, 0.9 + B.y, B.z); break; }
      case 'chase': camPos.set(-5.4, 1.7 + B.y * 0.8, B.z * 0.5 + Math.sin(t * 0.6) * 0.6); lookAt.set(3, 1 + B.y, B.z); fov = 52; break;
      case 'front': camPos.set(5.2 - t * 0.15, 0.6, B.z * 0.4 + d.side * 0.9); lookAt.set(0, 0.8 + B.y, B.z); fov = 38; break;
      case 'flyby': camPos.set(d.wx - dist, 0.9, d.side * 4.4); lookAt.set(0, 0.8 + B.y, B.z); fov = 40; break;
      case 'wheel': camPos.set(1.2 - t * 0.5, 0.4, d.side * 2.2 + B.z * 0.3); lookAt.set(0, 0.5 + B.y, B.z); fov = 58; break;
      case 'drone': camPos.set(-4 + t * 1.2, 8.5, B.z + d.side * 4); lookAt.set(1.5, B.y, B.z); fov = 42; break;
      case 'jumpSide': camPos.set(1.5 + t * 0.2, 2.3 + B.y * 0.55, 10); lookAt.set(2.5, 1.3 + B.y * 0.8, 0); fov = 50 - (jump.state === 'air' ? Math.sin(Math.PI * jump.p) * 10 : 0); break;
      case 'jumpFly': camPos.set(d.wx - dist, 0.55, 5.4); lookAt.set(0, 1 + B.y, B.z); fov = 55; break;
    }
    camera.position.copy(camPos);
    camera.lookAt(lookAt);
    cam.look.copy(lookAt);
    cam.fov = fov;
  }
  // shake + turbo rumble + FOV kick
  shake *= Math.exp(-5 * realDt);
  const sh = shake * 0.18 + turboAmt * 0.012;
  camera.position.x += rand(-sh, sh); camera.position.y += rand(-sh, sh); camera.position.z += rand(-sh, sh);
  // keep the horizontal view wide enough on tall (portrait) screens
  const vf = THREE.MathUtils.degToRad(cam.fov + turboAmt * 9) / 2, asp = Math.min(camera.aspect, 1.3);
  const fovT = Math.min(85, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(vf) * 1.3 / asp)));
  camera.fov += (fovT - camera.fov) * Math.min(1, realDt * 4);
  camera.updateProjectionMatrix();

  // ---------------- dashboard
  const kmh = Math.round(speed * 12 + (turboAmt > 0.1 ? rand(-2, 2) : 0));
  const frac = clamp(kmh / 300, 0, 1);
  kmhEl.textContent = kmh;
  gFill.setAttribute('stroke-dashoffset', (217.8 * (1 - frac)).toFixed(1));
  needle.setAttribute('transform', `rotate(${(-120 + frac * 240).toFixed(1)} 75 62)`);
  turboBtn.classList.toggle('on', turboAmt > 0.5);

  composer.render();
  requestAnimationFrame(tick);
}
startShot('orbit');
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
